# Agreement-gate thresholds and fault injection.
#
# World geometry, brick layout, board and named points live in `codes/scenario.json`,
# generated by `codes/make_arena.py`. Do not duplicate them here.
#
# Discrete-mock costs and failure rates live in `codes/mock_world.py` -> Config
# (nav_seconds, pick_seconds, p_nav_fail, p_pick_fail, p_misdetect, ...). They are
# placeholders until real runs give measured values.

# --- gate thresholds (docs/ALGORITHM.md §4) ---------------------------------
thresholds:
  conf_min: 0.35            # production CONF_THRESHOLD
  votes_n: 5                # frames in the voting window
  votes_k: 3                # votes needed inside the window
  cluster_radius_m: 0.06    # spatial clustering of detections
  r_station_m: 0.12         # G2: detection vs expected station pose
  r_zone_m: 0.15            # V2/V3: detection vs zone centre
  arrival_settle_s: 0.5     # motion below eps this long counts as arrived
  arrival_speed_eps: 0.02   # m/s
  nav_tolerance_default_m: 0.08
  recovery_backup_m: 0.20
  relocalize_cov_max: 0.05  # AMCL position covariance (m^2)
  time_reserve_s: 20.0      # kept free under the clock for verification/return
  pick_cost_estimate_s: 10.0  # G5 gross cost of one pick (tune from logs)
  verify_interval_s: 0.5      # spacing between verification scan windows

# --- fault injection for tests (docs/ALGORITHM.md §6) ------------------------
# All off by default; scenario tests override per case.
injection:
  single_frame_false_positive: false   # G1 must reject one-frame detections
  class_mismatch: false                # detector reports another class at the station
  ghost_cube_after_delivery: false     # perception sees a cube memory calls delivered
  pose_mismatch: false                 # detection far from the mapped station pose
  nav_abort_once: false                # one move_base ABORTED, then success
  pose_drift_at_step: null             # shift ground truth after step N
  arm_fail_once: false                 # pick fails once, succeeds on retry
