# detect_rknn.py 的默认参数。
# roslaunch 里用 <rosparam command="load" .../> 挂到节点私有命名空间；
# 单跑时可以直接覆盖：run rosrun semi_auto_match_24 detect_rknn.py _conf_thres:=0.4

# --- 模型与运行时（换板子 / 换模型改这里）---
# 官方 rknn_model_zoo 的默认 YOLOv5 模型（COCO 80 类，640×640 输入）。
# 板上随镜像部署，路径与本板厂商件一致。
model_path: /data/local/release/rknn-demo/model/yolov5s-640-640.rknn
lib_path: /data/local/release/rknn-demo/lib/librknnrt.so

# 留空 => 用 semi_auto_match_24/config/yolo/ 下的同名文件
labels_path: ""
anchors_path: ""

# --- 输入与阈值 ---
# (宽, 高)。留空（""）则由模型输入属性自动推断，适用于任何输入尺寸的模型。
img_size: [640, 640]
# 原版 TensorFlow 那条链的可视化阈值是 0.2；这里默认沿用 0.25（rknn_model_zoo 的
# YOLOv5 demo 默认值）。识别不稳时先调这个，不用改代码。
conf_thres: 0.25
nms_thres: 0.45
max_det: 100

# --- 兴趣区 ---
# 原程序只把 640×480 画面里的 image[160:480, 160:480] 送进模型，
# 再把框中心换算回整幅图像坐标（机械臂标定 thefile.txt 是整幅图像坐标系）。
# roi = (x, y, w, h)，单位像素；换成别的相机分辨率时按需改。
roi: [160, 160, 320, 320]
# roi_offset = 把 ROI 内坐标换算回整幅图像坐标时加的偏移；留空 => 用 roi 左上角。
# 原版写死的是 x:+160（=0.25*640）、y:+158.4（=0.33*480），要逐像素复现原版就写
# [160, 158.4]；默认用真实裁剪原点 [160, 160]，差 1.6 px。
roi_offset: []

# --- 性能 ---
# RK3588 有三个 NPU 核。不给 mask 时运行时只用 core0，
# 表现为 Core1/Core2 占用率恒为 0（不是故障，是没给它派活）。
core_mask: "0_1_2"

# --- 模型头约定（一般不用动）---
head: auto            # auto | v5 | v8
sigmoid: auto         # auto | on | off；只影响 v5 系解码

# --- 对外接口 ---
# true  => 类别 id 按 config/yolo/coco_labels.txt 换算成原程序用的
#          TF 90 类编号（西兰花=56、wine glass=46），grasp.py 不用改。
publish_tf_ids: true
publish_debug_image: true
verbose: false
